name: Verify Polybrutus D12 exact certificate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact symbolic mathematics
        run: python -m pip install sympy==1.14.0
      - name: Certify 12D metric, Gram rank, and model spectrum
        run: python src/verify_d12.py
      - name: Independently certify 136 rational distances and eigenvalue multiplicities
        run: python tests/independent_d12.py
